<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aikiki Soumagne</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
</head>

<body class="flex flex-col min-h-screen">
    <div id="header"></div>

    <!-- <main class="flex flex-grow flex-col gap-3 mx-[20%]"> -->
    <main class="overflow-hidden w-full">

        <div class="relative flex items-center">

            <div id="slider" class="flex transition-transform duration-700">
                <img class="w-full flex-shrink-0" src="../pictures/index/baniere/Groupe_accueil_1.jpg">
                <img class="w-full flex-shrink-0" src="../pictures/index/baniere/Groupe_accueil_2.jpg">
                <img class="w-full flex-shrink-0" src="../pictures/index/baniere/Groupe_accueil_3.jpg">
                <img class="w-full flex-shrink-0" src="../pictures/index/baniere/Groupe_accueil_4.jpg">
                <img class="w-full flex-shrink-0" src="../pictures/index/baniere/Groupe_accueil_5.jpg">
                <img class="w-full flex-shrink-0" src="../pictures/index/baniere/Groupe_accueil_6.jpg">
                <img class="w-full flex-shrink-0" src="../pictures/index/baniere/Groupe_accueil_7.jpg">
            </div>
            <button onclick="prevSlide()"
                class="absolute left-5 top-1/2 -translate-y-1/2 bg-white/70 px-4 py-2 rounded">
                <i class="fa-solid fa-caret-left text-2xl"></i>
            </button>

            <!-- bouton droite -->
            <button onclick="nextSlide()"
                class="absolute right-5 top-1/2 -translate-y-1/2 bg-white/70 px-4 py-2 rounded">
                <i class="fa-solid fa-caret-right text-2xl"></i>
            </button>
        </div>

    </main>

    <div id="footer"></div>
    <script>
        fetch("./imports/header.html")
            .then(response => response.text())
            .then(data => {
                document.getElementById("header").innerHTML = data;
            });

        fetch("./imports/footer.html")
            .then(response => response.text())
            .then(data => {
                document.getElementById("footer").innerHTML = data;
            });

        let current = 0;
        const slider = document.getElementById("slider");
        const total = 7;


        function updateSlider() {
            slider.style.transform = "translateX(-" + (current * 100) + "%)";
        }

        function nextSlide() {
            current++;
            if (current >= total) {
                current = 0;
            }
            updateSlider();
        }

        function prevSlide() {
            current--;
            if (current < 0) {
                current = total - 1;
            }
            updateSlider();
        }
        setInterval(() => {

            current++;

            if (current >= total) {
                current = 0;
            }

            updateSlider();

        }, 10000);
    </script>
    <div class="flex justify-center">
    </div>
</body>

</html>
