<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aikiki Soumagne</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
</head>

<body class="flex flex-col min-h-screen bg-[url('../pictures/background.avif')] bg-cover bg-center min-h-[500px]">
    <div id="header" class="!pb-0"></div>
    <main class="w-full flex-grow">
        <div class="overflow-hidden relative flex items-center">
            <div id="slider" class="flex transition-transform duration-700">
                <div class="w-full flex-shrink-0 relative">
                    <img src="../pictures/index/baniere/Aikido.jpg" class="w-full" />
                    <div class="absolute inset-0 bg-black opacity-30"></div>
                    <button
                        class="absolute left-1/3 top-1/2 md:top-2/3 -translate-x-1/2 -translate-y-1/2 px-2 py-1 md:px-4 md:py-3"
                        onclick="goToPage()">
                        <div class="flex flex-col text-base md:text-4xl font-bold text-white gap-1 md:gap-3">
                            <div class="flex justify-end">
                                <hr class="w-16 md:w-32 border-1 md:border-2">
                            </div>
                            <div class="pl-2 md:pl-4">
                                <p>Qu'est ce</p>
                                <p class="pl-2">que l'aikido</p>
                            </div>
                            <div class="flex justify-start">
                                <hr class="w-16 md:w-32 border-1 md:border-2">
                            </div>
                        </div>
                        <a href="aikido.html"
                            class="flex justify-end text-white underline hover:no-underline text-xs md:text-sm">En
                            savoir
                            plus</a>
                    </button>
                </div>
                <div class="w-full flex-shrink-0 relative">
                    <img src="../pictures/index/baniere/Dojo.jpg" class="w-full" />
                    <div class="absolute inset-0 bg-black opacity-30"></div>
                    <button
                        class="absolute left-2/3 top-1/2 md:top-2/3 -translate-x-1/2 -translate-y-1/2 px-2 py-1 md:px-4 md:py-3"
                        onclick="goToPage()">
                        <div class="flex flex-col text-base md:text-4xl font-bold text-white gap-1 md:gap-3">
                            <div class="flex justify-start">
                                <hr class="w-16 md:w-32 border-1 md:border-2">
                            </div>
                            <div class="pl-2 md:pl-4">
                                <p>Découvrez</p>
                                <p class="pl-2">Notre Dojo</p>
                            </div>
                            <div class="flex justify-end">
                                <hr class="w-16 md:w-32 border-1 md:border-2">
                            </div>
                        </div>
                        <a href="dojo.html" class="flex justify-start text-white underline hover:no-underline text-xs md:text-sm">En
                            savoir
                            plus</a>
                    </button>
                </div>
                <div class="w-full flex-shrink-0 relative">
                    <img src="../pictures/index/baniere/Les armes.jpg" class="w-full" />
                    <div class="absolute inset-0 bg-black opacity-30"></div>
                    <button
                        class="absolute left-1/3 top-1/2 md:top-2/3 -translate-x-1/2 -translate-y-1/2 px-2 py-1 md:px-4 md:py-3"
                        onclick="goToPage()">
                        <div class="flex flex-col text-base md:text-4xl font-bold text-white gap-1 md:gap-3">
                            <div class="flex justify-end">
                                <hr class="w-16 md:w-32 border-1 md:border-2">
                            </div>
                            <div class="pl-2 md:pl-4">
                                <p>Découvrez</p>
                                <p class="pl-2">Les armes</p>
                            </div>
                            <div class="flex justify-start">
                                <hr class="w-16 md:w-32 border-1 md:border-2">
                            </div>
                        </div>
                        <a href="armes.html" class="flex justify-end text-white underline hover:no-underline text-xs md:text-sm">En
                            savoir plus</a>
                    </button>
                </div>

                <div class="w-full flex-shrink-0 relative">
                    <img src="../pictures/index/baniere/Prof en action.jpg" class="w-full" />
                    <div class="absolute inset-0 bg-black opacity-30"></div>
                    <button
                        class="absolute left-1/3 top-1/2 md:top-2/3 -translate-x-1/2 -translate-y-1/2 px-2 py-1 md:px-4 md:py-3"
                        onclick="goToPage()">
                        <div class="flex flex-col text-base md:text-4xl font-bold text-white gap-1 md:gap-3">
                            <div class="flex justify-end">
                                <hr class="w-16 md:w-32 border-1 md:border-2">
                            </div>
                            <div class="pl-2 md:pl-4">
                                <p>Découvrez</p>
                                <p class="pl-2">Nos professeurs</p>
                            </div>
                            <div class="flex justify-start">
                                <hr class="w-16 md:w-32 border-1 md:border-2">
                            </div>
                        </div>
                        <a href="professeurs.html"
                            class="flex justify-end text-white underline hover:no-underline text-xs md:text-sm">En savoir plus</a>
                    </button>
                </div>
            </div>  
            <button id="prev-btn"
                class="absolute left-5 top-1/2 -translate-y-1/2 bg-white/70 px-2 py-1 md:px-4 md:py-2 rounded">
                <i class="fa-solid fa-caret-left text-xl md:text-2xl"></i>
            </button>
            <button id="next-btn"
                class="absolute right-5 top-1/2 -translate-y-1/2 bg-white/70 px-2 py-1 md:px-4 md:py-2 rounded">
                <i class="fa-solid fa-caret-right text-xl md:text-2xl"></i>
            </button>
            <button id="cta" onclick="goToPage()">
            </button>
        </div>
        <div id="events-container" class="flex flex-col gap-8 pt-5">
            <h2 class="text-2xl md:text-4xl pl-4 md:pl-12">Nos prochains événements</h2>
        </div>
    </main>

    <div id="footer"></div>

    <script type="module">
        import { displayImport, btnMenuClicker } from "../script/base.js";
        import { updateSlider, prevSlide, nextSlide } from "../script/baniere.js";
        import { displayEvent } from "../script/event.js";

        updateSlider();
        displayEvent();
        document.getElementById("prev-btn").addEventListener("click", prevSlide)
        document.getElementById("next-btn").addEventListener("click", nextSlide);

        displayImport().then(() => {
            document.getElementById("menu-btn").addEventListener("click", btnMenuClicker);
            document.getElementById("menu-btn-close").addEventListener("click", btnMenuClicker);
        });

        function goToPage() {
            window.location.href = urls[current];
        }
    </script>
</body>

</html>
